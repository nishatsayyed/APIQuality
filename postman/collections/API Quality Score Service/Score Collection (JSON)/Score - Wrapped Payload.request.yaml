$kind: http-request
name: Score - Wrapped Payload
method: POST
url: '{{baseUrl}}/score'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "format": "json",
      "collection": { "info": { "name": "Wrapped Sample" }, "item": [] }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test("report.collectionName === 'Wrapped Sample'", function () {
        const json = pm.response.json();
        pm.expect(json.report.collectionName).to.eql('Wrapped Sample');
      });
