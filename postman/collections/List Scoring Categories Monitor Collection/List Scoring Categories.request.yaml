$kind: http-request
name: List Scoring Categories
method: GET
url: '{{baseUrl}}/score/categories'
order: 1000
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', function () {
        pm.response.to.have.status(200);
      });
      const json = pm.response.json();
      pm.test('categories has 6 items', function () {
        pm.expect(json.categories).to.be.an('array').with.lengthOf(6);
      });
      pm.test('weights sum to 1.0', function () {
        const total = json.categories.reduce(function (acc, c) { return acc + (c.weight || 0); }, 0);
        pm.expect(Math.abs(total - 1.0)).to.be.lessThan(0.0001);
      });
      pm.test('gradeBands has 5 entries', function () {
        const bands = json.gradeBands;
        if (Array.isArray(bands)) {
          pm.expect(bands).to.have.lengthOf(5);
        } else {
          pm.expect(Object.keys(bands)).to.have.lengthOf(5);
        }
      });
    language: text/javascript
