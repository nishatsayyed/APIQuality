name: Push Postman Workspace to Cloud

on:
  push:
    branches:
      - main

jobs:
  postman-push:
    runs-on: ubuntu-latest
    env:
      POSTMAN_CHANNEL: beta

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Postman CLI
        run: |
          chmod +x .github/scripts/install-postman-cli.sh
          .github/scripts/install-postman-cli.sh

      - name: Authenticate Postman CLI
        run: postman login --with-api-key ${{ secrets.POSTMAN_API_KEY }}

      - name: Push workspace to Postman Cloud
        run: postman workspace push --yes
