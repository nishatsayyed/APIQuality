name: Postman Spec Lint

# Runs `postman spec lint` on the OpenAPI spec for every pull request
# targeting main. The job exits non-zero on lint failures, which — when
# this check is marked "Required" in the branch protection rules for
# `main` — will block the PR from being merged.

on:
  pull_request:
    branches:
      - main
    # Only re-run when something that affects the spec changes.
    paths:
      - 'index.yaml'
      - '.github/workflows/postman-spec-lint.yml'

jobs:
  spec-lint:
    name: Lint OpenAPI spec with Postman CLI
    runs-on: ubuntu-latest
    env:
      POSTMAN_CHANNEL: beta
      SPEC_PATH: index.yaml

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add Postman CLI to PATH
        run: echo "$HOME/.postman" >> $GITHUB_PATH

      - name: Install Postman CLI
        run: curl -o- "https://dl-cli.pstmn-beta.io/install/unix.sh" | sh

      - name: Authenticate Postman CLI
        run: postman login --with-api-key ${{ secrets.POSTMAN_API_KEY }}

      - name: Lint spec (human-readable output)
        run: postman spec lint "$SPEC_PATH" -f warning

      - name: Lint spec (JSON report for artifact)
        if: always()
        run: postman spec lint "$SPEC_PATH" -f warning -o json > spec-lint-report.json || true

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-spec-lint-report
          path: spec-lint-report.json
          if-no-files-found: ignore
