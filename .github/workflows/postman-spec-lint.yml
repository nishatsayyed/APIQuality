name: Lint Postman Spec

on:
  pull_request:
    branches:
      - main

jobs:
  postman-spec-lint:
    runs-on: ubuntu-latest
    env:
      POSTMAN_CHANNEL: beta

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add Postman CLI to PATH
        run: echo "$HOME/.postman" >> $GITHUB_PATH

      - name: Install and authenticate Postman CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://dl-cli.pstmn-beta.io/install/unix.sh" | sh

          export PATH="$HOME/.postman:$HOME/.local/bin:$PATH"
          command -v postman
          postman --version
          postman login --with-api-key "${{ secrets.POSTMAN_API_KEY }}"

      - name: Lint OpenAPI spec
        run: postman spec lint index.yaml
