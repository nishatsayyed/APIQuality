name: Postman Collection Run

on: push

jobs:
  postman-tests:
    runs-on: ubuntu-latest
    env:
      POSTMAN_CHANNEL: beta

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Postman CLI
        run: |
          chmod +x .github/scripts/install-postman-cli.sh
          .github/scripts/install-postman-cli.sh

      - name: Authenticate Postman CLI
        run: postman login --with-api-key ${{ secrets.POSTMAN_API_KEY }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install service dependencies
        working-directory: ./service
        run: npm install

      - name: Build service
        working-directory: ./service
        run: npm run build

      - name: Start service on localhost:3000
        working-directory: ./service
        run: |
          nohup npm start > service.log 2>&1 &
          echo $! > service.pid
          disown
          echo "Launched service with PID $(cat service.pid)"

      - name: Wait for service to be ready
        working-directory: ./service
        run: |
          for i in {1..30}; do
            if curl -sSf http://localhost:3000/health > /dev/null; then
              echo "Service is up"
              exit 0
            fi
            echo "Waiting for service... ($i)"
            sleep 1
          done
          echo "Service failed to start in time. Logs:"
          cat service.log || true
          exit 1

      - name: Run API Quality Score Service collection
        run: |
          postman collection run "1110081-abc03db5-abb6-448f-b10a-a3280d930938" \
            -e "1109466-25f7c205-0bbe-4a25-b78c-7806c396e274" \
            --report-events

      - name: Stop service
        if: always()
        working-directory: ./service
        run: |
          if [ -f service.pid ]; then
            kill "$(cat service.pid)" || true
          fi
